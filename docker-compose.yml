version: "3.8"

services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "80:5000"
    restart: always
    depends_on:
      - redis
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL:-}
      # Uncomment for horizontal scaling:
      # - REDIS_ADAPTER_URL=redis://redis:6379
    env_file:
      - ./server/.env

volumes:
  redis_data:
