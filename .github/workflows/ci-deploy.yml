# - Pull requests: tests only.
# - Merging to main: nothing runs (the manual deploy re-tests anyway).
# - Deploy: Actions tab → "CI / Deploy" → Run workflow (branch: main) →
#   tests, then deploy to Fly.io only if both suites pass. Each deploy
#   restarts the server and ends games in progress, so pick a quiet moment.
#
# Requires the repository secret FLY_API_TOKEN (`fly tokens create deploy`).
#
# Safe for a public repo: pull requests from forks run the tests only, with a
# read-only token and no secrets. Deploys need a manual start on main by the
# repository owner AND approval in the "production" environment
# (Settings → Environments → production → Required reviewers).

name: CI / Deploy

on:
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can read the code, nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Superseded test runs can be dropped; a manual deploy is never cancelled.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    name: Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.project }}
      - run: npm test
        working-directory: ${{ matrix.project }}

  deploy:
    name: Deploy to Fly.io
    needs: test
    # Only the owner can ship, even if collaborators with write access are added later
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://numwit.prajvex.com
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
